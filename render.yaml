services:
  - type: web
    name: wallet-by-pina
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: WALLET_DATA_DIRECTORY
        value: /tmp/wallet-by-pina-data
